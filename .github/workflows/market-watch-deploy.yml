name: Market Watch deployment

# Neither feature pushes nor pull requests receive production credentials.
# The connection branch only runs `probe`; it cannot select a release command.
on:
  push:
    branches:
      - ops/market-watch-connect
      - release/market-watch

permissions:
  contents: read

concurrency:
  group: market-watch-production
  cancel-in-progress: false

jobs:
  tests:
    if: github.repository == 'ToknNews/ToknClaw-Full_Backup'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - name: Test exact release without deployment secrets
        run: python -m unittest discover -s market_watch/tests -v

  connect-or-deploy:
    needs: tests
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    environment: market-watch-production
    steps:
      # No repository checkout or third-party action runs with these secrets.
      - name: Verify SSH identity and run the restricted command
        env:
          TOKN_SSH_HOST: ${{ secrets.TOKN_SSH_HOST }}
          TOKN_SSH_KEY: ${{ secrets.TOKN_SSH_KEY }}
          TOKN_KNOWN_HOSTS: ${{ secrets.TOKN_KNOWN_HOSTS }}
          TOKN_SSH_PORT: ${{ vars.TOKN_SSH_PORT || '22' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          def ssh_failure(stderr):
              # Return fixed guidance only. Never echo SSH's endpoint/key text.
              error = stderr.decode(errors='replace').lower()
              if 'host key verification failed' in error or 'host identification has changed' in error:
                  return 'Server identity check failed. Set TOKN_KNOWN_HOSTS to the complete public host-identity line printed by the installer.'
              if 'permission denied' in error:
                  return 'SSH rejected the deployment key. TOKN_SSH_KEY must be the private half of the public key installed for tokn-deploy.'
              if 'load key' in error or 'libcrypto' in error or 'invalid format' in error:
                  return 'SSH could not load TOKN_SSH_KEY. Paste the complete unencrypted private key, including its BEGIN/END lines.'
              if 'could not resolve hostname' in error:
                  return 'The configured server hostname could not be resolved. Check TOKN_SSH_HOST.'
              if 'connection timed out' in error or 'no route to host' in error:
                  return 'GitHub could not reach the SSH port. Check the server address, port and firewall rules for hosted runners.'
              if 'connection refused' in error:
                  return 'The server refused the configured SSH port. Check TOKN_SSH_PORT and the SSH service.'
              if 'connection closed' in error or 'connection reset' in error:
                  return 'The server or network closed the SSH connection. Inspect the server SSH authentication log.'
              return 'SSH did not complete. Inspect the server receipt and SSH authentication log; sensitive diagnostics were withheld.'

          os.umask(0o077)
          required = ('TOKN_SSH_HOST', 'TOKN_SSH_KEY', 'TOKN_KNOWN_HOSTS')
          missing = [name for name in required if not os.environ.get(name, '').strip()]
          if missing:
              raise SystemExit('Add these environment secrets first: ' + ', '.join(missing))
          host = os.environ['TOKN_SSH_HOST'].strip()
          port = os.environ['TOKN_SSH_PORT']
          if (not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9.:-]{0,252}', host)
                  or not port.isdecimal() or not 1 <= int(port) <= 65535):
              raise SystemExit('Invalid SSH host or port configuration.')
          branch = os.environ['GITHUB_REF']
          commit = os.environ['GITHUB_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', commit):
              raise SystemExit('Invalid release SHA.')
          if branch == 'refs/heads/ops/market-watch-connect':
              command = 'probe'
          elif branch == 'refs/heads/release/market-watch':
              command = 'deploy ' + commit
          else:
              raise SystemExit('This branch is not authorized for the deployment workflow.')
          with tempfile.TemporaryDirectory(prefix='tokn-ssh-') as directory:
              key = Path(directory) / 'key'
              known = Path(directory) / 'known_hosts'
              private = os.environ['TOKN_SSH_KEY'].replace('\r\n', '\n').strip()
              if private.startswith(('ssh-', 'SHA256:')):
                  raise SystemExit('TOKN_SSH_KEY contains a public key or fingerprint. Copy the private key file without the .pub extension.')
              key.write_text(private + '\n')
              known.write_text(os.environ['TOKN_KNOWN_HOSTS'].replace('\r\n', '\n').strip() + '\n')
              key.chmod(0o600)
              known.chmod(0o600)
              validation = subprocess.run(['ssh-keygen', '-y', '-P', '', '-f', str(key)],
                                          stdin=subprocess.DEVNULL, capture_output=True, timeout=5)
              if validation.returncode:
                  raise SystemExit('TOKN_SSH_KEY is not a readable unencrypted private key. Paste the full file, including BEGIN/END lines and actual newlines.')
              validation = subprocess.run(['ssh-keygen', '-F', 'tokn-market-watch', '-f', str(known)],
                                          stdin=subprocess.DEVNULL, capture_output=True, timeout=5)
              if validation.returncode:
                  raise SystemExit('TOKN_KNOWN_HOSTS must contain the entire line beginning tokn-market-watch ssh-ed25519 from the installer.')
              print('Private key format and host-alias entry validated; checking SSH access.')
              args = ['ssh', '-F', '/dev/null', '-T', '-i', str(key), '-p', port,
                      '-o', 'BatchMode=yes', '-o', 'IdentitiesOnly=yes',
                      '-o', 'PasswordAuthentication=no', '-o', 'KbdInteractiveAuthentication=no',
                      '-o', 'StrictHostKeyChecking=yes', '-o', 'HostKeyAlias=tokn-market-watch',
                      '-o', 'HostKeyAlgorithms=ssh-ed25519',
                      '-o', 'UserKnownHostsFile=' + str(known),
                      '-o', 'GlobalKnownHostsFile=/dev/null',
                      '-o', 'ConnectTimeout=15', '-o', 'ServerAliveInterval=15',
                      '-o', 'ServerAliveCountMax=3', 'tokn-deploy@' + host, command]
              # Endpoints, private keys and SSH diagnostics are never printed.
              try:
                  result = subprocess.run(args, capture_output=True, timeout=1250)
              except (OSError, subprocess.TimeoutExpired):
                  raise SystemExit('SSH could not complete. A started deployment worker may '
                                   'still be running; inspect its receipt before retrying.')
              print(result.stdout.decode(errors='replace'))
              if result.returncode:
                  print(ssh_failure(result.stderr))
                  print('Exit status:', result.returncode)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('Market Watch command: `' + command + '`\n\n')
                  summary.write('Result: ' + ('passed' if result.returncode == 0 else 'needs review') + '\n')
              raise SystemExit(result.returncode)
          PY
