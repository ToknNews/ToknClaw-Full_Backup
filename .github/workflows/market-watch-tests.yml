name: Market Watch offline tests

on:
  pull_request:
    paths:
      - "market_watch/**"
      - "config/market_watch.json"
      - ".github/workflows/market-watch-tests.yml"
  push:
    paths:
      - "market_watch/**"
      - "config/market_watch.json"
      - ".github/workflows/market-watch-tests.yml"

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run isolated offline tests
        run: python -m unittest discover -s market_watch/tests -v
